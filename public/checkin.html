<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Check in</title>
    <style>
      :root { color-scheme: light; font-family: system-ui, sans-serif; background: #f4f7f5; color: #17221c; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; }
      #app { width: min(92vw, 560px); }
      .card { background: white; border: 1px solid #d9e2dc; border-radius: 18px; padding: 24px; box-shadow: 0 12px 35px rgba(23,34,28,.08); }
      .eyebrow { color: #5b6b62; text-transform: uppercase; letter-spacing: .12em; font-size: .75rem; }
      h1 { margin-top: 4px; }
      label { display: grid; gap: 8px; font-weight: 700; }
      input { width: 100%; box-sizing: border-box; border: 1px solid #9dadA2; border-radius: 10px; padding: 14px; font-size: 16px; }
      button { border: 0; border-radius: 10px; padding: 12px 14px; margin-top: 10px; font-weight: 700; cursor: pointer; }
      .primary { width: 100%; background: #176b43; color: white; }
      .secondary { background: #edf4ef; color: #173c29; width: 100%; }
      .suggestions { display: grid; margin-top: 6px; }
      .suggestion { background: #f5f8f6; color: #17221c; text-align: left; }
      .notice { margin-top: 16px; }
      .notice.ok { color: #176b43; font-weight: 700; }
      .notice.error { color: #9d2424; font-weight: 700; }
      .identity-options { display: grid; }
      .info { color: #5b6b62; }
    </style>
  </head>
  <body><main id="app">Loading check-in…</main><script src="/checkin.js"></script></body>
</html>
