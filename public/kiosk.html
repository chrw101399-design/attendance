<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Attendance QR</title>
    <style>
      :root { color-scheme: light; font-family: system-ui, sans-serif; background: #10271b; color: white; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; }
      .kiosk-card { text-align: center; background: white; color: #17221c; border-radius: 24px; padding: 32px; max-width: 620px; }
      .kiosk-card img { display: block; width: min(80vw, 520px); height: auto; margin: 20px auto; image-rendering: pixelated; background: white; border: 12px solid white; box-shadow: 0 3px 14px rgba(23,34,28,.18); }
      .eyebrow { text-transform: uppercase; letter-spacing: .12em; color: #5b6b62; }
      #qr-expiry { font-weight: 700; }
      .session { color: #5b6b62; font-size: .85rem; overflow-wrap: anywhere; }
    </style>
  </head>
  <body><main id="app">Loading QR display…</main><script src="/kiosk.js"></script></body>
</html>
